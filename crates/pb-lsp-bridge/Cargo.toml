[package]
name = "pb-lsp-bridge"
version = "0.3.0"
edition = "2021"
license = "MIT"

[dependencies]
pb-mcp-server = { path = "../..", features = ["lsp-bridge"] }
lsp-types = "0.95"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
