[package]
name = "pb-dashboard"
version = "0.3.0"
edition = "2021"
license = "MIT"

[dependencies]
pb-mcp-server = { path = "../..", features = ["dashboard"] }
eframe = "0.29"
egui = "0.29"
egui_plot = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
