[package]
name = "mint-mcp-server"
version = "0.1.0"
edition = "2021"

[dependencies]
rmcp = { version = "1.2.0", features = ["server"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
ignore = "0.4"
globset = "0.4"
regex = "1"
fs4 = "0.13"
