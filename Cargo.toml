[workspace]
members = [
    ".",
    "crates/pb-dashboard",
    "crates/pb-gateway",
    "crates/pb-lsp-bridge",
    "crates/pb-network-node",
]
resolver = "2"

[package]
name = "pb-mcp-server"
version = "0.3.0"
edition = "2021"
authors = ["PanosBiazis <panosbiazis2003@gmail.com>"]
description = "Profile-based IDE agent MCP server for Zed/Cursor with multi-agent bus, code intelligence, and execution tools"
license = "MIT"
repository = "https://github.com/PanosBiazis/pb-mcp-server"
readme = "README.md"
keywords = ["mcp", "zed", "cursor", "ai", "agent", "code-intelligence"]
categories = ["development-tools", "development-tools::testing"]

[lib]
name = "pb_mcp_server"
path = "src/lib.rs"

[[bin]]
name = "pb-mcp-server"
path = "src/main.rs"

[[bin]]
name = "pb-dashboard"
path = "src/bin/pb-dashboard.rs"
required-features = ["dashboard"]

[[bin]]
name = "pb-gateway"
path = "src/bin/pb-gateway.rs"

[[bin]]
name = "pb-lsp-bridge"
path = "src/bin/pb-lsp-bridge.rs"
required-features = ["lsp-bridge"]

[[bin]]
name = "pb-network-node"
path = "src/bin/pb-network-node.rs"
required-features = ["network-node"]

[dependencies]
# MCP Protocol
rmcp = { version = "1.2.0", features = ["server"] }

# Async Runtime
tokio = { version = "1", features = ["full", "tracing"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9.42"
toml = "0.8"
schemars = "1"

# File System & Walking
ignore = "0.4"
globset = "0.4"
walkdir = "2"
fs4 = "0.13"

# Pattern Matching
regex = "1"

# System Information & Health Monitoring
sysinfo = "0.30"

# Concurrent Programming
crossbeam = "0.8"
crossbeam-channel = "0.5"

# LSP Bridge
lsp-types = { version = "0.95", optional = true }

# Memory Mapping (for large file optimization)
memmap2 = { version = "0.9", optional = true }

# HTTP Server (Gateway)
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "compression-gzip"] }
hyper = "1"

# Security & Cryptography
subtle = "2"
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = { version = "0.22", default-features = false, features = ["std"] }

# Compression
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zstd = "0.13"

# Error Handling
thiserror = "2"
anyhow = "1"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Async Utilities
futures = "0.3"
async-trait = "0.1"
parking_lot = "0.12"
dashmap = "6"

# Text Processing
unicode-segmentation = "1"
html-escape = "0.2"

# GUI Dashboard
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "x11"], optional = true }
egui = { version = "0.35", optional = true }
egui_plot = { version = "0.36", optional = true }

# AI Agent Framework (rig-based agent workers)
rig-core = { version = "0.10", default-features = false, features = ["reqwest-rustls"], optional = true }

[dependencies.ort]
version = "2.0.0-rc.12"
optional = true
default-features = false
features = ["load-dynamic", "ndarray", "tracing", "api-24"]

[dependencies.ndarray]
version = "0.15"
optional = true

[dependencies.tokenizers]
version = "0.23"
optional = true
default-features = false
features = ["onig"]

# Image Processing (for OCR/Screenshots)
[dependencies.image]
version = "0.25"
optional = true

# Web Tools
[dependencies.reqwest]
version = "0.13"
features = ["json", "gzip", "brotli", "stream", "rustls"]
optional = true

[dependencies.scraper]
version = "0.27"
optional = true

[dependencies.select]
version = "0.6"
optional = true

[dependencies.url]
version = "2"
features = ["serde"]
optional = true

[dependencies.tokio-tungstenite]
version = "0.29"
features = ["rustls-tls-native-roots"]
optional = true

[dependencies.futures-util]
version = "0.3"
optional = true

[dependencies.mime]
version = "0.3"
optional = true

[dependencies.mime_guess]
version = "2"
optional = true

[dependencies.robotstxt]
version = "0.3"
optional = true

# Network & P2P
[dependencies.libp2p]
version = "0.56"
default-features = false
features = ["tokio", "macros", "tcp", "noise", "yamux", "gossipsub", "kad", "identify", "ping"]
optional = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal", "process"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
criterion = "0.5"
tokio-test = "0.4"
wiremock = "0.6"
mockito = "1"

[features]
default = ["core-code", "agent-orchestration", "review-refactor"]

# Core Profiles
core-code = []
review-refactor = ["core-code"]
agent-orchestration = ["core-code", "agent-workers"]
# Note: OCR tools use CLI-based OCR (`tesseract` / `tesseract.exe` via
# std::process::Command) instead of linking platform-specific Rust bindings.
# This keeps the MCP tool surface available across Linux, Windows, and macOS;
# runtime availability depends on the corresponding CLI being installed.
local-power = ["dep:image", "web-tools"]
public-safe = ["web-tools-safe"]
experimental-lab = ["local-power", "dep:ort", "dep:ndarray", "dep:tokenizers", "web-tools"]

# Web Tool Features
web-tools = ["dep:reqwest", "dep:scraper", "dep:url", "dep:mime", "dep:mime_guess", "dep:robotstxt"]
perf-mmap = ["dep:memmap2"]
web-tools-safe = ["web-tools"]
web-websocket = ["dep:tokio-tungstenite", "dep:futures-util"]
web-scraping = ["web-tools", "dep:select"]
dashboard = ["dep:eframe", "dep:egui", "dep:egui_plot"]
lsp-bridge = ["dep:lsp-types"]
agent-workers = ["dep:rig-core"]

# Feature Groups
# dashboard is included here so `--features full` builds pb-dashboard too.
full-headless = ["default", "local-power", "experimental-lab", "agent-workers", "network-node"]
full = ["full-headless", "dashboard"]

# Lighter Windows cross-compilation profile (x86_64-pc-windows-gnu from Linux).
# Exact `--all-features` is supported when the MinGW target is installed; this
# profile exists for smaller Windows binaries that skip optional heavy ML deps.
# All CLI-based tools (OCR via tesseract.exe, screenshot, sandbox, ...) still
# compile; they simply require the corresponding Windows binaries at runtime.
#
# Build with:
#   cargo build --release --target x86_64-pc-windows-gnu --features full-windows
full-headless-windows = ["default", "dep:image", "web-tools", "agent-workers", "network-node"]
full-windows = ["full-headless-windows", "dashboard"]

network-node = ["dep:libp2p"]
tor-bridge = [] # Uses subprocess torsocks/tor CLI

# Individual tool categories
git-write = []
terminal-exec = []
ocr-tools = ["dep:image"]
ml-tools = ["dep:ort", "dep:ndarray", "dep:tokenizers"]
screenshot-tools = ["dep:image"]
web-fetch = ["web-tools"]
web-search = ["web-tools"]
web-scrape = ["web-tools", "web-scraping"]
# Passthrough feature aliases so #[cfg(feature = "ort")] / #[cfg(feature = "tokenizers")]
# in neural.rs are recognised by Cargo's check-cfg lints without triggering
# unexpected_cfg warnings. These just re-enable the corresponding dep.
ort = ["dep:ort"]
tokenizers = ["dep:tokenizers"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 2

[[bench]]
name = "bus_performance"
harness = false

[[bench]]
name = "code_index"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
